name: validate-wally-skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate-wally-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install storyboard pipeline dependencies
        run: python -m pip install Pillow reportlab

      - name: Install Chinese TrueType font for review artifacts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-wqy-zenhei

      - name: Validate skill contracts and frozen surfaces
        run: python scripts/validate_wally_skills.py --skills-root .

      - name: Run contract and storyboard regressions
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s wally-storyboard-designer/tests -p 'test_*.py' -v
